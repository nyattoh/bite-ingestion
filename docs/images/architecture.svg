<text x="395" y="1008" class="tiny" text-anchor="start">All arm–document combinations</text>
<text x="750" y="952" class="metric" text-anchor="start">112 → 91</text>
<text x="750" y="983" class="body" text-anchor="start">Visible payload tokens</text>
<text x="750" y="1008" class="tiny" text-anchor="start">One file: D09, REDUCE only</text>
<text x="1100" y="952" class="metric" text-anchor="start">17 / 18</text>
<text x="1100" y="983" class="body" text-anchor="start">Files with no operation</text>
<text x="1100" y="1008" class="tiny" text-anchor="start">Effective changed sample: n = 1</text>
<text x="60" y="1054" class="body" text-anchor="start">No downstream quality, actual cost, latency or hallucination benefit established. Recovery ≠ payload sufficiency.</text>
<text x="42" y="1117" class="small" text-anchor="start">Paper v2.0 evidence ≠ current repository snapshot (main dce759ef / Phase2A). See README for the version distinction.</text>
