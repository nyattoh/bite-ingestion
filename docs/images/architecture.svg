<text x="60" y="844" class="eyebrow" text-anchor="start">02  /  REPORTED FROZEN EVALUATION (PAPER v2.0)</text>
<text x="60" y="875" class="body" text-anchor="start">Assignment projection → reference-dispersion gate → fixed-order actionable subset → payload + recovery</text>
<text x="60" y="900" class="small" text-anchor="start">Frozen subset order: UNTANGLE → REDUCE → INTEGRATE. Only REDUCE executed in the retained trial.</text>
